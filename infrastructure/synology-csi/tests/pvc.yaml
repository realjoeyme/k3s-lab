apiVersion: v1
kind: Namespace
metadata:
  name: synology-csi-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-smoke-test
  namespace: synology-csi-test
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: synology-iscsi-retain
  resources:
    requests:
      storage: 1Gi
