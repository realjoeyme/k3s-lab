apiVersion: v1
kind: Pod
metadata:
  name: iscsi-smoke
  namespace: synology-csi-test
spec:
  nodeSelector:
    kubernetes.io/hostname: k3s-02
  containers:
    - name: test
      image: busybox:1.36.1
      command:
        - /bin/sh
        - -c
      args:
        - |
          set -eu
          cat /data/proof.txt
          cd /data
          sha256sum -c proof.sha256
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: iscsi-smoke-test
